<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heart English</title><style>:root{--bg:#f7f7f4;--card:#fff;--ink:#171717;--muted:#777;--line:#e8e7e2}*{box-sizing:border-box}body{margin:0;background:#ecebe7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;color:var(--ink)}.wrap{width:min(100%,430px);min-height:100vh;margin:auto;background:var(--bg);display:flex;align-items:center;padding:28px 20px}.card{width:100%;background:#fff;border:1px solid var(--line);border-radius:26px;padding:26px 22px}.brand{font-size:12px;font-weight:900;letter-spacing:.14em;margin-bottom:28px}h1{font-size:30px;margin:0 0 8px}.sub{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:20px}.label{font-size:12px;font-weight:850;margin:15px 0 7px}input,select{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px;font:inherit;background:#fbfbf9}.help{font-size:11px;line-height:1.5;color:#777;background:#f3f2ee;border-radius:12px;padding:10px 12px;margin-top:8px}.admin{background:#fff4da}.btn{width:100%;border:0;border-radius:14px;padding:15px 16px;background:#111;color:#fff;font-weight:900;margin-top:20px}.msg{font-size:10.5px;color:#999;line-height:1.5;margin-top:12px;text-align:center}.hidden{display:none}</style></head><body><div class="wrap"><div class="card"><div class="brand">HEART ENGLISH</div><h1>반가워요 👋</h1><div class="sub">이용 유형을 선택하고 시작해보세요.</div><div class="label">이용 유형</div><select id="role" onchange="changeRole()"><option value="current">현재 수강생</option><option value="former">이전 수강생</option><option value="new">신규가입</option><option value="admin">하나쌤 · 관리자</option></select><div id="help" class="help">현재 수강생은 등록된 이름과 수강반을 확인합니다.</div><div id="nameWrap"><div class="label">성 + 이름</div><input id="name" placeholder="예: 강신숙"></div><div id="classWrap"><div class="label">수강반</div><select id="cls"><option value="">수강반을 선택해주세요</option><option value="월수 10:30 초중급">월·수 10:30 초중급</option><option value="월수 12:00 고급">월·수 12:00 고급</option><option value="월수 17:30 초중급">월·수 17:30 초중급</option><option value="월수 19:00 고급">월·수 19:00 고급</option><option value="토 10:20 고급">토요일 10:20 고급</option><option value="월수 연속반">월·수 연속반</option></select></div><div id="pinWrap" class="hidden"><div class="label">관리자 코드</div><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="4자리 코드"><div class="help admin">관리자 모드는 학생 CRM 학습 기록에 포함되지 않습니다.</div></div><button class="btn" onclick="login()">시작하기 →</button><div id="msg" class="msg">등록된 이름과 수강반이 일치해야 로그인됩니다.</div></div></div><script>
const STUDENTS=[['HE-001','강신숙','월수 10:30 초중급'],['HE-002','강신영','월수 10:30 초중급'],['HE-003','김병하','월수 10:30 초중급'],['HE-004','오현주','월수 10:30 초중급'],['HE-005','이세빈','월수 10:30 초중급'],['HE-006','이세영','월수 10:30 초중급'],['HE-007','주민진','월수 10:30 초중급'],['HE-008','이가현','월수 17:30 초중급'],['HE-009','박지연','월수 17:30 초중급'],['HE-010','허선미','월수 17:30 초중급'],['HE-011','이정찬','월수 12:00 고급'],['HE-012','조동희','월수 12:00 고급'],['HE-013','표승수','월수 12:00 고급'],['HE-014','홍서영','월수 12:00 고급'],['HE-015','정서현','월수 12:00 고급'],['HE-016','김미수','월수 19:00 고급'],['HE-017','유경근','월수 19:00 고급'],['HE-018','유세일','월수 19:00 고급'],['HE-019','이예원','월수 19:00 고급'],['HE-020','이태훈','월수 19:00 고급'],['HE-021','함수진','월수 19:00 고급'],['HE-022','김영호','토 10:20 고급'],['HE-023','문슬기빛','토 10:20 고급'],['HE-024','박수연','토 10:20 고급'],['HE-025','백초연','토 10:20 고급'],['HE-026','송인숙','토 10:20 고급'],['HE-027','안소현','토 10:20 고급'],['HE-028','이승훈','토 10:20 고급'],['HE-029','이태희','토 10:20 고급'],['HE-030','오수진','토 10:20 고급'],['HE-031','이대영','월수 연속반']];
function clean(v){return String(v||'').replace(/\s+/g,'').trim()}function changeRole(){const r=role.value;nameWrap.classList.toggle('hidden',r==='admin');classWrap.classList.toggle('hidden',r!=='current');pinWrap.classList.toggle('hidden',r!=='admin');help.classList.toggle('admin',r==='admin');help.textContent=r==='current'?'현재 수강생은 등록된 이름과 수강반을 확인합니다.':r==='former'?'이전 수강생으로 구분되어 현재 수강생 데이터와 섞이지 않습니다.':r==='new'?'신규가입으로 구분되어 먼저 Library를 둘러볼 수 있습니다.':'관리자 코드가 맞아야 Care Dashboard에 들어갈 수 있습니다.';msg.textContent=r==='admin'?'관리자 코드를 입력해주세요.':'이름을 입력하고 시작해주세요.'}
function setUser(id,n,c,r){localStorage.setItem('heartStudentId',id);localStorage.setItem('heartStudentName',n);localStorage.setItem('heartStudentClass',c);localStorage.setItem('heartUserRole',r)}
function login(){const r=role.value;if(r==='admin'){if(pin.value!=='1234'){msg.textContent='관리자 코드가 맞지 않아요.';return}setUser('ADMIN-001','하나쌤','관리자','admin');sessionStorage.setItem('heartAdminAuth','1');location.href='admin.html';return}const n=clean(name.value);if(!n){msg.textContent='이름을 입력해주세요.';return}if(r==='current'){const c=cls.value;if(!c){msg.textContent='수강반을 선택해주세요.';return}const s=STUDENTS.find(x=>clean(x[1])===n&&x[2]===c);if(!s){msg.textContent='등록된 이름과 수강반이 일치하지 않아요.';return}setUser(s[0],s[1],s[2],'current');location.href='app.html';return}if(r==='former'){setUser('FORMER-'+Date.now(),name.value.trim(),'이전 수강생','former');location.href='learn.html';return}setUser('NEW-'+Date.now(),name.value.trim(),'신규가입','new');location.href='learn.html'}
</script></body></html>
